spring:
  datasource:
    url: jdbc:h2:mem:auth_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  spring:
    data:
      redis:
        url: ${SPRING_DATA_REDIS_URL:}
        password: ${SPRING_DATA_REDIS_PASSWORD:}
        timeout: 2000ms

  app:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-expiration: 30m
      refresh-token-expiration: 7d
