syntax = "proto3";

package control.v1;

option go_package = "github.com/DoMinhHHung/pizza/services/control-plane/api/gen/control/v1;controlv1";

import "google/protobuf/timestamp.proto";

service OrganizationService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization);
  rpc ListMyOrganizations(ListMyOrganizationsRequest) returns (ListMyOrganizationsResponse);
}

message CreateOrganizationRequest {
  string name = 1;
  string slug = 2;
}

message ListMyOrganizationsRequest {}

message ListMyOrganizationsResponse {
  repeated Organization organizations = 1;
}

message Organization {
  string id = 1;
  string name = 2;
  string slug = 3;
  string role = 4; // OWNER | MEMBER
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
