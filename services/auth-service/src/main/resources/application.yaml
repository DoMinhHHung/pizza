spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
app:
  jwt:
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    key-id: ${JWT_KEY_ID:pizza-auth-1}
    access-token-expiration: 15m
    refresh-token-expiration: 14d
  security:
    max-failed-attempts: 5
    lock-duration: 30m
    verification-token-ttl: 24h
    reset-token-ttl: 1h
    rate-limit:
      login-requests: 10
      login-window: 1m
      register-requests: 5
      register-window: 1m
      forgot-password-requests: 3
      forgot-password-window: 1m
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    allow-credentials: true
    max-age: 3600
