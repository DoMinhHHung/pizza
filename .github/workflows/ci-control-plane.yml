name: ci-control-plane

on:
  push:
    branches:
      - main
      - pizza/**
    paths:
      - "services/control-plane/**"
      - ".github/workflows/ci-control-plane.yml"
  pull_request:
    branches:
      - main
      - pizza/**
    paths:
      - "services/control-plane/**"
      - ".github/workflows/ci-control-plane.yml"

permissions:
  contents: read

jobs:
  test-control-plane:
    name: Build and test control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pizza_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: services/control-plane

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pizza_control_test?sslmode=disable

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: services/control-plane/go.sum

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Migrate
        run: goose -dir migrations postgres "$DATABASE_URL" up

      - name: Test
        run: go test ./... -count=1 -timeout 120s

      - name: Build
        run: go build -o /tmp/control-plane ./cmd/server

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Regenerate proto and diff
        run: |
          make proto
          git diff --exit-code -- api/gen
