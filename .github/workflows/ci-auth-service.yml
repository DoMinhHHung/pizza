name: ci-auth-service

on:
  push:
    branches:
      - main
      - pizza/**
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"
  pull_request:
    branches:
      - main
      - pizza/**
    paths:
      - "services/auth-service/**"
      - ".github/workflows/ci-auth-service.yml"

concurrency:
  group: ci-auth-service-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-auth-service:
    name: Build and test auth-service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/auth-service/pom.xml

      - name: Build and run tests
        run: ./mvnw -B clean verify -DskipITs
